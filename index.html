<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glove KB">
  <title>장갑 키보드 실험</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="topline">
        <span class="title">장갑 키보드 실험</span>
        <span class="ver"></span>
        <span id="badge-sim" class="badge sim" hidden>시뮬레이션 (실제 데이터 아님)</span>
        <button id="exp-btn" class="ghost">실험자</button>
      </div>
      <div id="stepbar" hidden><div class="steptext"></div><div class="progress"><div></div></div></div>
      <nav id="tabs" hidden>
        <button data-screen="summary">종합</button>
        <button data-screen="demo">시연</button>
        <button data-screen="replay">탭 재생</button>
        <button data-screen="settings">설정</button>
        <button data-screen="flow" class="back">← 실험 화면</button>
      </nav>
    </header>
    <main id="screens"></main>
    <div id="keyboard"></div>
  </div>
  <noscript>이 페이지는 JavaScript가 필요합니다.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
