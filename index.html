<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glove KB">
  <title>장갑 보정 키보드 데모</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="title">장갑 보정 키보드 <span class="ver">데모</span></div>
      <div class="badges">
        <span id="badge-cond" class="badge"></span>
        <span id="badge-model" class="badge"></span>
        <span id="badge-sim" class="badge sim" hidden>시뮬레이션 (실제 데이터 아님)</span>
      </div>
      <nav id="tabs">
        <button data-screen="demo">비교 데모</button>
        <button data-screen="calib">보정</button>
        <button data-screen="trial">따라 쓰기</button>
        <button data-screen="replay">실제 탭 재생</button>
        <button data-screen="settings">설정·로그</button>
      </nav>
    </header>
    <main id="screens"></main>
    <div id="keyboard"></div>
  </div>
  <noscript>이 데모는 JavaScript가 필요합니다.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
